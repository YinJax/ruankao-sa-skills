<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" viewBox="0 0 960 304" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rk-skills-title rk-skills-desc">
  <title id="rk-skills-title">软考系统架构设计师三个命令</title>
  <desc id="rk-skills-desc">图示展示 rk-basic、rk-case、rk-essay 三个命令如何按基础补齐、案例训练和论文成稿的顺序组成备考流程。</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');
      .title { font-family: "Instrument Serif", Georgia, "Microsoft YaHei", serif; }
      .sans { font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
      .mono { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
    <marker id="rk-skills-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="rk-skills-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
  </defs>

  <rect width="960" height="304" fill="#f5f5f5"/>
  <text x="48" y="44" class="title" fill="#2d3142" font-size="28">Ruankao SA Command Map</text>
  <text x="48" y="72" class="mono" fill="#4f5d75" font-size="12" letter-spacing=".16em">FOUNDATION → CASE → ESSAY</text>

  <line x1="304" y1="164" x2="344" y2="164" stroke="#4f5d75" stroke-width="1" marker-end="url(#rk-skills-arrow)"/>
  <line x1="608" y1="164" x2="648" y2="164" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#rk-skills-arrow-accent)"/>

  <rect x="48" y="96" width="256" height="136" rx="8" fill="#f5f5f5"/>
  <rect x="48" y="96" width="256" height="136" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1"/>
  <rect x="64" y="112" width="32" height="16" rx="4" fill="rgba(45,49,66,0.10)" stroke="rgba(45,49,66,0.24)" stroke-width=".8"/>
  <text x="80" y="124" class="mono" fill="#4f5d75" font-size="8" font-weight="600" text-anchor="middle">01</text>
  <text x="176" y="128" class="mono" fill="#2d3142" font-size="20" font-weight="600" text-anchor="middle">/rk-basic</text>
  <text x="176" y="152" class="sans" fill="#2d3142" font-size="16" font-weight="600" text-anchor="middle">基础补齐</text>
  <text x="72" y="180" class="mono" fill="#7a8399" font-size="8" letter-spacing=".12em">INPUT</text>
  <text x="136" y="180" class="sans" fill="#4f5d75" font-size="12">知识点 · 计算题</text>
  <text x="72" y="204" class="mono" fill="#7a8399" font-size="8" letter-spacing=".12em">OUTPUT</text>
  <text x="144" y="204" class="sans" fill="#4f5d75" font-size="12">框架 · 步骤 · 速记</text>

  <rect x="352" y="96" width="256" height="136" rx="8" fill="#f5f5f5"/>
  <rect x="352" y="96" width="256" height="136" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <rect x="368" y="112" width="32" height="16" rx="4" fill="rgba(235,108,54,0.18)" stroke="rgba(235,108,54,0.48)" stroke-width=".8"/>
  <text x="384" y="124" class="mono" fill="#eb6c36" font-size="8" font-weight="600" text-anchor="middle">02</text>
  <text x="480" y="128" class="mono" fill="#2d3142" font-size="20" font-weight="600" text-anchor="middle">/rk-case</text>
  <text x="480" y="152" class="sans" fill="#2d3142" font-size="16" font-weight="600" text-anchor="middle">案例训练</text>
  <text x="376" y="180" class="mono" fill="#7a8399" font-size="8" letter-spacing=".12em">INPUT</text>
  <text x="440" y="180" class="sans" fill="#4f5d75" font-size="12">题干 · 答案草稿</text>
  <text x="376" y="204" class="mono" fill="#7a8399" font-size="8" letter-spacing=".12em">OUTPUT</text>
  <text x="448" y="204" class="sans" fill="#4f5d75" font-size="12">线索 · 采分点 · 诊断</text>

  <rect x="656" y="96" width="256" height="136" rx="8" fill="#f5f5f5"/>
  <rect x="656" y="96" width="256" height="136" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.16)" stroke-width="1"/>
  <rect x="672" y="112" width="32" height="16" rx="4" fill="rgba(45,49,66,0.10)" stroke="rgba(45,49,66,0.24)" stroke-width=".8"/>
  <text x="688" y="124" class="mono" fill="#4f5d75" font-size="8" font-weight="600" text-anchor="middle">03</text>
  <text x="784" y="128" class="mono" fill="#2d3142" font-size="20" font-weight="600" text-anchor="middle">/rk-essay</text>
  <text x="784" y="152" class="sans" fill="#2d3142" font-size="16" font-weight="600" text-anchor="middle">论文成稿</text>
  <text x="680" y="180" class="mono" fill="#7a8399" font-size="8" letter-spacing=".12em">INPUT</text>
  <text x="744" y="180" class="sans" fill="#4f5d75" font-size="12">题目 · 项目事实</text>
  <text x="680" y="204" class="mono" fill="#7a8399" font-size="8" letter-spacing=".12em">OUTPUT</text>
  <text x="752" y="204" class="sans" fill="#4f5d75" font-size="12">覆盖 · 估分 · 修改</text>

  <line x1="48" y1="264" x2="912" y2="264" stroke="rgba(45,49,66,0.12)" stroke-width=".8"/>
  <text x="48" y="284" class="mono" fill="#7a8399" font-size="8" letter-spacing=".16em">WHEN TO USE</text>
  <text x="156" y="284" class="sans" fill="#4f5d75" font-size="12">先补知识，再练案例，最后把项目经验整理成可写、可改、可复盘的论文素材。</text>
</svg>
