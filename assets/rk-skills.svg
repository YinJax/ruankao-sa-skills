      .mono { font-family: "Geist", -apple-system, "system-ui", "Segoe UI", "Microsoft YaHei", sans-serif; }
    </style>
    <marker id="rk-skills-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
