  <text x="48" y="304" class="mono" fill="#7a8399" font-size="8" letter-spacing=".12em">BOUNDARY</text>
  <text x="144" y="304" class="sans" fill="#4f5d75" font-size="12">模板用于考场改写和复盘，不承诺官方分数，也不补造项目事实。</text>
