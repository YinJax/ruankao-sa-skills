  <text x="48" y="120" class="mono" fill="#7a8399" font-size="12" font-weight="600" letter-spacing=".12em">FOUNDATION + CASE</text>
  <text x="192" y="296" class="mono" fill="#7a8399" font-size="12" font-weight="600" letter-spacing=".12em">ESSAY TRAINING</text>

