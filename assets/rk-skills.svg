  <text x="48" y="300" class="mono" fill="#7a8399" font-size="8" font-weight="600" letter-spacing=".04em">HOW TO USE</text>
  <text x="144" y="300" class="sans" fill="#4f5d75" font-size="16">先补知识和英语，再练案例，用真实项目生成可替换论文母版，最后拿草稿做题干覆盖和过线风险诊断。</text>
  <text x="48" y="332" class="mono" fill="#7a8399" font-size="8" font-weight="600" letter-spacing=".04em">BOUNDARY</text>
  <text x="144" y="332" class="sans" fill="#4f5d75" font-size="16">专业英语用于快速识别高频词；论文模板用于考场改写和复盘，不承诺官方分数，也不补造项目事实。</text>
