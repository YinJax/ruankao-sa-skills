<svg width="1000" height="220" viewBox="0 0 1000 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">RK Skills command cards</title>
  <desc id="desc">Three minimal command cards for rk-basic, rk-case, and rk-essay.</desc>
  <defs>
    <linearGradient id="basic" x1="64" y1="48" x2="300" y2="168" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="case" x1="382" y1="48" x2="618" y2="168" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="essay" x1="700" y1="48" x2="936" y2="168" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DC2626"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
    <filter id="cardShadow" x="24" y="18" width="952" height="184" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <g filter="url(#cardShadow)">
    <rect x="64" y="42" width="254" height="136" rx="18" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="84" y="62" width="214" height="42" rx="12" fill="url(#basic)"/>
    <text x="104" y="89" fill="#FFFFFF" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700">/rk-basic</text>
    <text x="84" y="132" fill="#0F172A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">补基础</text>
    <text x="84" y="157" fill="#64748B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">考点解释 · 计算步骤 · 速记</text>

    <rect x="373" y="42" width="254" height="136" rx="18" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="393" y="62" width="214" height="42" rx="12" fill="url(#case)"/>
    <text x="413" y="89" fill="#FFFFFF" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700">/rk-case</text>
    <text x="393" y="132" fill="#0F172A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">拆案例</text>
    <text x="393" y="157" fill="#64748B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">线索提取 · 采分点 · 诊断</text>

    <rect x="682" y="42" width="254" height="136" rx="18" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="702" y="62" width="214" height="42" rx="12" fill="url(#essay)"/>
    <text x="722" y="89" fill="#FFFFFF" font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700">/rk-essay</text>
    <text x="702" y="132" fill="#0F172A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">练论文</text>
    <text x="702" y="157" fill="#64748B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">题目覆盖 · 项目事实 · 修改项</text>
  </g>
</svg>
