  <line x1="48" y1="272" x2="1540" y2="272" stroke="rgba(45,49,66,0.12)" stroke-width=".8"/>
  <text x="48" y="300" class="mono" fill="#7a8399" font-size="8" font-weight="600" letter-spacing=".04em">HOW TO USE</text>
  <text x="144" y="300" class="sans" fill="#4f5d75" font-size="16">先补知识和英语，再用 /rk-case-card 背专题，用 /rk-case-drill 练真题，最后进入论文模板、押题和诊断。</text>
  <text x="48" y="332" class="mono" fill="#7a8399" font-size="8" font-weight="600" letter-spacing=".04em">BOUNDARY</text>
  <text x="144" y="332" class="sans" fill="#4f5d75" font-size="16">案例卡只管背诵地图；案例训练只管具体题目拆解、答案诊断和模拟评分。</text>
