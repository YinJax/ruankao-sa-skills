<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" viewBox="0 0 960 304" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rk-skills-title rk-skills-desc">
  <title id="rk-skills-title">软考系统架构设计师三个命令</title>
  <desc id="rk-skills-desc">图示展示 rk-basic、rk-case、rk-essay 三个命令如何按基础补齐、案例训练和论文成稿的顺序组成备考流程。</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');
      /* Match Waza's compact Anthropic Sans treatment; fall back cleanly on GitHub. */
      .title, .sans, .mono { font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", "Microsoft YaHei", sans-serif; }
    </style>
    <marker id="rk-skills-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="rk-skills-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
  </defs>

  <rect width="960" height="304" fill="#f5f5f5"/>
  <text x="48" y="44" class="title" fill="#2d3142" font-size="24" font-weight="500">Ruankao SA Command Map</text>
  <text x="48" y="72" class="mono" fill="#4f5d75" font-size="12" letter-spacing=".10em">FOUNDATION  ·  CASE  ·  ESSAY</text>

  <line x1="304" y1="152" x2="344" y2="152" stroke="#73726c" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#rk-skills-arrow)"/>
  <line x1="608" y1="152" x2="648" y2="152" stroke="#73726c" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#rk-skills-arrow-accent)"/>

  <rect x="48" y="96" width="256" height="112" rx="8" fill="#f5f5f5"/>
  <rect x="48" y="96" width="256" height="112" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.20)" stroke-width=".8"/>
  <text x="176" y="136" class="sans" fill="#2d3142" font-size="16" font-weight="500" text-anchor="middle">/rk-basic</text>
  <text x="176" y="164" class="sans" fill="#4f5d75" font-size="12" font-weight="400" text-anchor="middle">基础补齐 · 知识点与计算题</text>
  <text x="176" y="184" class="sans" fill="#4f5d75" font-size="12" font-weight="400" text-anchor="middle">框架 · 步骤 · 速记</text>

  <rect x="352" y="96" width="256" height="112" rx="8" fill="#f5f5f5"/>
  <rect x="352" y="96" width="256" height="112" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
  <text x="480" y="136" class="sans" fill="#2d3142" font-size="16" font-weight="500" text-anchor="middle">/rk-case</text>
  <text x="480" y="164" class="sans" fill="#4f5d75" font-size="12" font-weight="400" text-anchor="middle">案例训练 · 题干与答案草稿</text>
  <text x="480" y="184" class="sans" fill="#4f5d75" font-size="12" font-weight="400" text-anchor="middle">线索 · 采分点 · 诊断</text>

  <rect x="656" y="96" width="256" height="112" rx="8" fill="#f5f5f5"/>
  <rect x="656" y="96" width="256" height="112" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.20)" stroke-width=".8"/>
  <text x="784" y="136" class="sans" fill="#2d3142" font-size="16" font-weight="500" text-anchor="middle">/rk-essay</text>
  <text x="784" y="164" class="sans" fill="#4f5d75" font-size="12" font-weight="400" text-anchor="middle">论文成稿 · 题目与项目事实</text>
  <text x="784" y="184" class="sans" fill="#4f5d75" font-size="12" font-weight="400" text-anchor="middle">覆盖 · 估分 · 修改</text>

  <line x1="48" y1="240" x2="912" y2="240" stroke="rgba(45,49,66,0.12)" stroke-width=".8"/>
  <text x="48" y="260" class="mono" fill="#7a8399" font-size="8" letter-spacing=".12em">WHEN TO USE</text>
  <text x="156" y="260" class="sans" fill="#4f5d75" font-size="12">先补知识，再练案例，最后把项目经验整理成可写、可改、可复盘的论文素材。</text>
</svg>
