<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rk-skills-title rk-skills-desc">
  <title id="rk-skills-title">软考系统架构设计师七个命令</title>
  <desc id="rk-skills-desc">展示七个软考系统架构设计师备考命令的两行地图：基础知识、专业英语、案例必背卡、案例真题训练、论文模板、考前押题和论文诊断。</desc>
