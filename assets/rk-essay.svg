  <text x="40" y="60" class="mono" fill="#4f5d75" font-size="12" letter-spacing=".12em">/RK-ESSAY · TOPIC / FACTS / REVISION</text>

  <line x1="184" y1="136" x2="216" y2="136" stroke="#4f5d75" stroke-width="1" marker-end="url(#rk-essay-arrow)"/>
  <line x1="344" y1="136" x2="376" y2="136" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#rk-essay-arrow-accent)"/>
  <line x1="504" y1="136" x2="536" y2="136" stroke="#4f5d75" stroke-width="1" marker-end="url(#rk-essay-arrow)"/>

  <rect x="56" y="96" width="128" height="80" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
