<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" viewBox="0 0 720 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rk-essay-title rk-essay-desc">
  <title id="rk-essay-title">/rk-essay 论文训练修改路径</title>
  <desc id="rk-essay-desc">展示 /rk-essay 从论文题目到项目事实、结构覆盖并输出优先修改项的训练流程。</desc>
  <defs>
