  <rect x="388" y="108" width="32" height="16" rx="4" fill="rgba(235,108,54,0.18)" stroke="rgba(235,108,54,0.45)" stroke-width=".8"/>
  <text x="404" y="120" class="mono" fill="#eb6c36" font-size="8" font-weight="600" text-anchor="middle">CORE</text>
