  <text x="120" y="160" class="sans" fill="#4f5d75" font-size="12" text-anchor="middle">方向 · 要求</text>

  <rect x="216" y="96" width="128" height="80" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
  <rect x="228" y="108" width="32" height="16" rx="4" fill="rgba(45,49,66,0.08)" stroke="rgba(45,49,66,0.20)" stroke-width=".8"/>
  <text x="244" y="120" class="mono" fill="#4f5d75" font-size="8" font-weight="600" text-anchor="middle">FACT</text>
