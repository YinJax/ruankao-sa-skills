      .title { font-family: "Instrument Serif", Georgia, serif; }
      .sans { font-family: "Geist", "Microsoft YaHei", sans-serif; }
      .mono { font-family: "Geist Mono", Consolas, monospace; }
    </style>
    <marker id="rk-essay-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
