<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" viewBox="0 0 960 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rk-basic-title rk-basic-desc">
  <title id="rk-basic-title">/rk-basic 基础知识复习路径</title>
  <desc id="rk-basic-desc">展示 /rk-basic 从输入考点到定位体系、拆解计算并输出速记卡的复习流程。</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');
      .title { font-family: "Instrument Serif", Georgia, serif; }
      .sans { font-family: "Geist", "Microsoft YaHei", sans-serif; }
      .mono { font-family: "Geist Mono", Consolas, monospace; }
    </style>
    <marker id="rk-basic-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="rk-basic-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
  </defs>

  <rect width="960" height="220" fill="#f5f5f5"/>
  <text x="40" y="36" class="title" fill="#2d3142" font-size="28">Foundation Coach</text>
  <text x="40" y="60" class="mono" fill="#4f5d75" font-size="12" letter-spacing=".12em">/RK-BASIC · KNOWLEDGE / CALCULATION / REVIEW</text>

  <line x1="216" y1="124" x2="296" y2="124" stroke="#4f5d75" stroke-width="1" marker-end="url(#rk-basic-arrow)"/>
  <line x1="440" y1="124" x2="520" y2="124" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#rk-basic-arrow-accent)"/>
  <line x1="664" y1="124" x2="744" y2="124" stroke="#4f5d75" stroke-width="1" marker-end="url(#rk-basic-arrow)"/>

  <rect x="72" y="88" width="144" height="72" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
  <rect x="84" y="100" width="32" height="16" rx="4" fill="rgba(45,49,66,0.08)" stroke="rgba(45,49,66,0.20)" stroke-width=".8"/>
  <text x="100" y="112" class="mono" fill="#4f5d75" font-size="8" font-weight="600" text-anchor="middle">ASK</text>
  <text x="144" y="128" class="sans" fill="#2d3142" font-size="16" font-weight="600" text-anchor="middle">输入考点</text>
  <text x="144" y="148" class="sans" fill="#4f5d75" font-size="12" text-anchor="middle">概念 · 易混点</text>

  <rect x="296" y="88" width="144" height="72" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
  <rect x="308" y="100" width="32" height="16" rx="4" fill="rgba(45,49,66,0.08)" stroke="rgba(45,49,66,0.20)" stroke-width=".8"/>
  <text x="324" y="112" class="mono" fill="#4f5d75" font-size="8" font-weight="600" text-anchor="middle">MAP</text>
  <text x="368" y="128" class="sans" fill="#2d3142" font-size="16" font-weight="600" text-anchor="middle">定位体系</text>
  <text x="368" y="148" class="sans" fill="#4f5d75" font-size="12" text-anchor="middle">章节 · 高频区</text>

  <rect x="520" y="88" width="144" height="72" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <rect x="532" y="100" width="32" height="16" rx="4" fill="rgba(235,108,54,0.18)" stroke="rgba(235,108,54,0.45)" stroke-width=".8"/>
  <text x="548" y="112" class="mono" fill="#eb6c36" font-size="8" font-weight="600" text-anchor="middle">CORE</text>
  <text x="592" y="128" class="sans" fill="#2d3142" font-size="16" font-weight="600" text-anchor="middle">拆解计算</text>
  <text x="592" y="148" class="sans" fill="#4f5d75" font-size="12" text-anchor="middle">公式 · 步骤</text>

  <rect x="744" y="88" width="144" height="72" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
  <rect x="756" y="100" width="32" height="16" rx="4" fill="rgba(45,49,66,0.08)" stroke="rgba(45,49,66,0.20)" stroke-width=".8"/>
  <text x="772" y="112" class="mono" fill="#4f5d75" font-size="8" font-weight="600" text-anchor="middle">OUT</text>
  <text x="816" y="128" class="sans" fill="#2d3142" font-size="16" font-weight="600" text-anchor="middle">速记卡</text>
  <text x="816" y="148" class="sans" fill="#4f5d75" font-size="12" text-anchor="middle">考前复盘</text>

  <line x1="40" y1="184" x2="920" y2="184" stroke="rgba(45,49,66,0.12)" stroke-width=".8"/>
  <text x="40" y="204" class="mono" fill="#7a8399" font-size="8" letter-spacing=".16em">OUTPUT</text>
  <text x="112" y="204" class="sans" fill="#4f5d75" font-size="12">考点解释 · 计算步骤 · 知识框架 · 考前速记</text>
</svg>
