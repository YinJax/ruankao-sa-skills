<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" viewBox="0 0 720 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rk-basic-title rk-basic-desc">
  <title id="rk-basic-title">/rk-basic 基础知识复习路径</title>
  <desc id="rk-basic-desc">展示 /rk-basic 从输入考点到定位体系、拆解计算并输出速记卡的复习流程。</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');
      .title { font-family: "Instrument Serif", Georgia, serif; }
      .sans { font-family: "Geist", "Microsoft YaHei", sans-serif; }
      .mono { font-family: "Geist Mono", Consolas, monospace; }
    </style>
    <marker id="rk-basic-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="rk-basic-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
  </defs>

  <rect width="720" height="260" fill="#f5f5f5"/>
  <text x="40" y="36" class="title" fill="#2d3142" font-size="28">Foundation Coach</text>
  <text x="40" y="60" class="mono" fill="#4f5d75" font-size="12" letter-spacing=".12em">/RK-BASIC · KNOWLEDGE / CALCULATION / REVIEW</text>

  <line x1="184" y1="136" x2="216" y2="136" stroke="#4f5d75" stroke-width="1" marker-end="url(#rk-basic-arrow)"/>
  <line x1="344" y1="136" x2="376" y2="136" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#rk-basic-arrow-accent)"/>
  <line x1="504" y1="136" x2="536" y2="136" stroke="#4f5d75" stroke-width="1" marker-end="url(#rk-basic-arrow)"/>

  <rect x="56" y="96" width="128" height="80" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
  <rect x="68" y="108" width="32" height="16" rx="4" fill="rgba(45,49,66,0.08)" stroke="rgba(45,49,66,0.20)" stroke-width=".8"/>
  <text x="84" y="120" class="mono" fill="#4f5d75" font-size="8" font-weight="600" text-anchor="middle">ASK</text>
  <text x="120" y="140" class="sans" fill="#2d3142" font-size="16" font-weight="600" text-anchor="middle">输入考点</text>
  <text x="120" y="160" class="sans" fill="#4f5d75" font-size="12" text-anchor="middle">概念 · 易混点</text>

  <rect x="216" y="96" width="128" height="80" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
  <rect x="228" y="108" width="32" height="16" rx="4" fill="rgba(45,49,66,0.08)" stroke="rgba(45,49,66,0.20)" stroke-width=".8"/>
  <text x="244" y="120" class="mono" fill="#4f5d75" font-size="8" font-weight="600" text-anchor="middle">MAP</text>
  <text x="280" y="140" class="sans" fill="#2d3142" font-size="16" font-weight="600" text-anchor="middle">定位体系</text>
  <text x="280" y="160" class="sans" fill="#4f5d75" font-size="12" text-anchor="middle">章节 · 高频区</text>

  <rect x="376" y="96" width="128" height="80" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <rect x="388" y="108" width="32" height="16" rx="4" fill="rgba(235,108,54,0.18)" stroke="rgba(235,108,54,0.45)" stroke-width=".8"/>
  <text x="404" y="120" class="mono" fill="#eb6c36" font-size="8" font-weight="600" text-anchor="middle">CORE</text>
  <text x="440" y="140" class="sans" fill="#2d3142" font-size="16" font-weight="600" text-anchor="middle">拆解计算</text>
  <text x="440" y="160" class="sans" fill="#4f5d75" font-size="12" text-anchor="middle">公式 · 步骤</text>

  <rect x="536" y="96" width="128" height="80" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
  <rect x="548" y="108" width="32" height="16" rx="4" fill="rgba(45,49,66,0.08)" stroke="rgba(45,49,66,0.20)" stroke-width=".8"/>
  <text x="564" y="120" class="mono" fill="#4f5d75" font-size="8" font-weight="600" text-anchor="middle">OUT</text>
  <text x="600" y="140" class="sans" fill="#2d3142" font-size="16" font-weight="600" text-anchor="middle">速记卡</text>
  <text x="600" y="160" class="sans" fill="#4f5d75" font-size="12" text-anchor="middle">考前复盘</text>

  <line x1="40" y1="216" x2="680" y2="216" stroke="rgba(45,49,66,0.12)" stroke-width=".8"/>
  <text x="40" y="236" class="mono" fill="#7a8399" font-size="8" letter-spacing=".16em">OUTPUT</text>
  <text x="112" y="236" class="sans" fill="#4f5d75" font-size="12">考点解释 · 计算步骤 · 知识框架 · 考前速记</text>
</svg>
